name: tiruttaniquick_admin
description: "Thiruttani Quick - Grocery Delivery Admin App"
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  tiruttaniquick_shared:
    path: ../Tiruttaniquick_shared

  cloud_firestore: ^5.6.10
  cupertino_icons: ^1.0.8
  firebase_auth: ^5.6.2
  firebase_core: ^3.14.0
  firebase_app_check: ^0.3.1
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^18.0.1
  go_router: ^17.3.0
  google_sign_in: ^6.3.0
  intl: ^0.20.2
