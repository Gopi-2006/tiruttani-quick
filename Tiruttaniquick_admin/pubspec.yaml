  url_launcher: ^6.3.1
  flutter_ringtone_player: ^4.0.0
  excel: ^4.0.6
  file_picker: ^8.1.4
  cached_network_image: ^3.4.1
  path_provider: ^2.1.3
  pdf: ^3.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
